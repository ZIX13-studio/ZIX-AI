<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIX AI — бесплатный ИИ на системе ZIXD</title>
<meta name="description" content="ZIX AI — бесплатная нейросеть на системе распределения запросов ZIXD. Тестирование и обновления — в Telegram.">
<meta name="theme-color" content="#07070c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070c; --panel:rgba(17,17,27,.72); --line:rgba(168,85,247,.16);
  --accent:#A855F7; --accent2:#3B82F6; --cyan:#22D3EE; --text:#E7E7EE; --muted:#9aa0b0;
  --ok:#10B981; --no:#F87171;
  --fd:'Zen Dots','Manrope',sans-serif; --fb:'Manrope',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fb);background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.65;font-size:16px}
::selection{background:rgba(168,85,247,.4)}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:#0a0a12}
::-webkit-scrollbar-thumb{background:linear-gradient(#A855F7,#3B82F6);border-radius:5px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes panelIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ringPulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes hintB{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(8px);opacity:1}}
@keyframes zdash{to{stroke-dashoffset:-16}}
@keyframes zblink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes zring{0%{transform:scale(.72);opacity:.9}100%{transform:scale(1.55);opacity:0}}
@keyframes nowPing{0%{box-shadow:0 0 0 0 rgba(168,85,247,.5)}100%{box-shadow:0 0 0 16px rgba(168,85,247,0)}}

.app{position:relative;min-height:100vh}
.progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:120;
  background:linear-gradient(90deg,#A855F7,#3B82F6,#22D3EE);box-shadow:0 0 12px rgba(168,85,247,.6)}
.bg-fallback{position:fixed;inset:0;z-index:-3;background:
  radial-gradient(60% 50% at 70% 10%,rgba(168,85,247,.14),transparent 60%),
  radial-gradient(50% 40% at 20% 80%,rgba(59,130,246,.10),transparent 60%),var(--bg)}
.bg-container{position:fixed;inset:0;z-index:-2}
.bg-overlay{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,7,12,.25),rgba(7,7,12,.72) 55%,rgba(7,7,12,.97))}

/* NAV — только бренд и Telegram */
.navbar{position:fixed;top:3px;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
  padding:14px 36px;background:rgba(7,7,12,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:#fff}
.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#A855F7,#3B82F6);box-shadow:0 4px 18px rgba(168,85,247,.45)}
.brand-name{font-family:var(--fd);font-size:19px;letter-spacing:1px}
.brand-name b{color:var(--accent);font-weight:400}
.nav-tag{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;
  padding:5px 12px;border:1px solid var(--line);border-radius:999px;margin-left:14px}

/* HERO */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:130px 40px 40px;position:relative}
.hero-grid{max-width:1380px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;
  color:#d8b4fe;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.3);margin-bottom:22px}
.hero-tech{height:170px;position:relative;margin-bottom:14px}
.hero-sub{font-family:var(--fd);font-size:17px;color:#c4b5fd;margin-bottom:14px;letter-spacing:.5px}
.hero-desc{font-size:16.5px;color:var(--muted);max-width:560px;margin-bottom:34px}
.hero-desc b{color:#c4b5fd;font-weight:700}
.hero-cta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:30px}
.hero-chips{display:flex;gap:18px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);font-weight:600}
.chip svg{color:var(--ok)}
.chip.zixd svg{color:var(--cyan)}
.hero-ball{height:520px;position:relative;animation:floatY 7s ease-in-out infinite}
.ball-fallback{position:absolute;top:50%;left:50%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(196,132,252,.5),rgba(168,85,247,.14) 48%,transparent 72%);
  box-shadow:0 0 120px rgba(168,85,247,.35),inset 0 0 80px rgba(168,85,247,.25);filter:blur(1px)}
.hero-ball .crystalized-ball{position:absolute;inset:0}
.scroll-hint{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);
  font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-top:40px}
.scroll-hint svg{animation:hintB 1.8s ease-in-out infinite;color:var(--accent)}

/* STATS */
.stats{max-width:1200px;margin:0 auto;padding:10px 40px 30px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.stat{display:flex;align-items:center;gap:14px;padding:20px 22px;border-radius:18px;background:var(--panel);
  border:1px solid var(--line);backdrop-filter:blur(12px)}
.stat-ic{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,rgba(168,85,247,.9),rgba(59,130,246,.9))}
.stat b{display:block;font-size:19px;font-family:var(--fd);font-weight:400;color:#fff;line-height:1.25}
.stat span{font-size:12.5px;color:var(--muted)}

/* SECTIONS */
section{padding:90px 40px;position:relative}
.sec-head{text-align:center;max-width:760px;margin:0 auto 54px}
.sec-kicker{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.sec-title{font-size:40px;font-weight:800;line-height:1.15;margin-bottom:14px;
  background:linear-gradient(92deg,#fff 20%,#c4b5fd 60%,#93c5fd);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sec-sub{color:var(--muted);font-size:16px}

/* WHY */
.why-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.why-card{padding:36px 30px;border-radius:22px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(14px);transition:transform .4s var(--ease),border-color .4s,box-shadow .4s;position:relative;overflow:hidden}
.why-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);transform:translateX(-100%);transition:transform .7s}
.why-card:hover{transform:translateY(-8px);border-color:rgba(168,85,247,.5);box-shadow:0 24px 50px -20px rgba(168,85,247,.35)}
.why-card:hover::before{transform:translateX(100%)}
.why-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;margin-bottom:20px;
  background:linear-gradient(135deg,#A855F7,#3B82F6);box-shadow:0 8px 24px -6px rgba(168,85,247,.5)}
.why-card h3{font-size:19px;font-weight:800;margin-bottom:10px}
.why-card p{color:var(--muted);font-size:14.5px}

/* ZIXD */
.zixd-grid{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1fr 1.1fr;gap:30px;align-items:stretch}
.zixd-info{padding:38px;border-radius:24px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px)}
.zixd-logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--fd);font-size:22px;color:#fff;margin-bottom:16px}
.zixd-logo em{font-style:normal;color:var(--cyan)}
.zixd-logo span{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#22D3EE,#3B82F6);box-shadow:0 8px 22px -6px rgba(34,211,238,.5)}
.zixd-lead{color:var(--muted);font-size:15.5px;margin-bottom:26px}
.zixd-lead b{color:#a5f3fc;font-weight:700}
.zixd-feats{display:flex;flex-direction:column;gap:14px}
.zixd-feat{display:flex;gap:14px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.05);transition:border-color .3s,transform .3s}
.zixd-feat:hover{border-color:rgba(34,211,238,.35);transform:translateX(4px)}
.zixd-feat-ic{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;color:#67e8f9;
  background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.25)}
.zixd-feat b{display:block;font-size:15px;margin-bottom:2px}
.zixd-feat p{font-size:13.5px;color:var(--muted);line-height:1.55}
.zixd-viz{padding:30px;border-radius:24px;background:var(--panel);border:1px solid rgba(34,211,238,.2);
  backdrop-filter:blur(14px);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.zixd-viz::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 45%,rgba(34,211,238,.06),transparent 70%)}
.zixd-viz svg{width:100%;height:auto;display:block;position:relative}
.zbase{fill:none;stroke:rgba(168,85,247,.22);stroke-width:2}
.zflow{fill:none;stroke:url(#zflowGrad);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:5 11;animation:zdash 1s linear infinite}
.zring{fill:none;stroke:#22D3EE;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:zring 2.6s ease-out infinite}
.zdot{animation:zblink 1.6s infinite}
.zlabel{font-family:'Manrope',sans-serif;fill:#9aa0b0;font-size:12px;font-weight:600}
.zbrand{font-family:'Zen Dots',cursive;fill:#fff;font-size:17px}
.zsrv{font-family:'Manrope',sans-serif;fill:#e7e7ee;font-size:13px;font-weight:700}
.zon{font-family:'Manrope',sans-serif;fill:#34d399;font-size:10px;font-weight:600}
.zlegend{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:18px;position:relative}
.zlegend span{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:600}
.zlegend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* CAPABILITIES */
.caps-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;gap:26px;align-items:start}
.caps-menu-card{padding:26px 22px;border-radius:22px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px)}
.caps-menu-title{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:16px;padding-left:14px}
.cap-panel{padding:38px;border-radius:22px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);
  min-height:440px;animation:panelIn .45s var(--ease)}
.cap-top{display:flex;align-items:center;gap:18px;margin-bottom:20px}
.cap-ic{width:62px;height:62px;flex:none;border-radius:18px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#A855F7,#3B82F6);box-shadow:0 10px 30px -8px rgba(168,85,247,.55)}
.cap-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;padding:5px 12px;border-radius:999px;margin-bottom:6px}
.cap-badge.can{color:#6ee7b7;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35)}
.cap-badge.no{color:#fca5a5;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35)}
.cap-badge.feat{color:#d8b4fe;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.35)}
.cap-panel h3{font-size:26px;font-weight:800;line-height:1.2}
.cap-desc{color:var(--muted);font-size:15.5px;margin-bottom:22px;max-width:640px}
.cap-points{list-style:none;display:flex;flex-direction:column;gap:11px;margin-bottom:28px}
.cap-points li{display:flex;align-items:flex-start;gap:11px;font-size:14.5px;color:#cfd2dc;
  padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05)}
.cap-points li svg{flex:none;margin-top:2px}
.cap-points.can li svg{color:var(--ok)}
.cap-points.no li svg{color:var(--no)}
.cap-points.feat li svg{color:var(--accent)}

/* DRIFT */
.drift-wrap{max-width:1400px;margin:0 auto;height:620px;border-radius:26px;overflow:hidden;
  border:1px solid var(--line);background:rgba(10,10,18,.5)}
.drift-note{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13.5px;margin-top:22px}
.drift-note svg{color:var(--accent)}

/* TRY / LOCKED */
.try-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:stretch}
.locked-card{position:relative;border-radius:24px;overflow:hidden;background:var(--panel);
  border:1px solid var(--line);backdrop-filter:blur(14px);min-height:420px}
.ghost-chat{padding:30px;display:flex;flex-direction:column;gap:14px;filter:blur(7px);opacity:.45;
  pointer-events:none;user-select:none;-webkit-user-select:none}
.ghost-msg{max-width:80%;padding:13px 18px;border-radius:16px;font-size:14px;line-height:1.6}
.ghost-msg.u{align-self:flex-end;background:linear-gradient(135deg,rgba(168,85,247,.35),rgba(59,130,246,.35));border:1px solid rgba(168,85,247,.4)}
.ghost-msg.a{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.ghost-msg pre{margin-top:8px;padding:10px 12px;border-radius:10px;background:#0b0b14;font-family:ui-monospace,monospace;font-size:12px;color:#c4b5fd}
.ghost-input{margin:6px 30px 30px;height:52px;border-radius:14px;background:rgba(255,255,255,.05);
  border:1px solid rgba(168,85,247,.25);filter:blur(5px);opacity:.4}
.locked-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:30px;background:radial-gradient(60% 60% at 50% 45%,rgba(7,7,12,.55),rgba(7,7,12,.85))}
.lock-ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#fff;position:relative;
  background:linear-gradient(135deg,#A855F7,#3B82F6);box-shadow:0 14px 44px -8px rgba(168,85,247,.6)}
.lock-ring::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid rgba(168,85,247,.6);animation:ringPulse 2.4s infinite}
.locked-overlay h3{font-size:22px;font-weight:800}
.locked-overlay p{color:var(--muted);font-size:14.5px;max-width:340px}
.try-cta{padding:44px 40px;border-radius:24px;background:linear-gradient(135deg,rgba(34,158,217,.12),rgba(168,85,247,.08));
  border:1px solid rgba(34,158,217,.3);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
.try-cta-ic{width:70px;height:70px;border-radius:20px;display:grid;place-items:center;color:#fff;margin-bottom:22px;
  background:linear-gradient(135deg,#229ED9,#0088cc);box-shadow:0 14px 40px -8px rgba(34,158,217,.6)}
.try-cta h3{font-size:27px;font-weight:800;margin-bottom:12px}
.try-cta p{color:var(--muted);font-size:15.5px;margin-bottom:28px}
.try-perks{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.try-perk{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted);font-weight:600}
.try-perk svg{color:#229ED9}
.try-handle{margin-top:16px;font-family:var(--fd);font-size:13px;color:#7cc8ff}

/* ROADMAP */
.roadmap{max-width:860px;margin:0 auto;position:relative;padding-left:8px}
.roadmap::before{content:'';position:absolute;left:31px;top:20px;bottom:20px;width:2px;
  background:linear-gradient(180deg,#A855F7,rgba(59,130,246,.5),rgba(168,85,247,.1))}
.rm-item{display:grid;grid-template-columns:48px 1fr;gap:22px;margin-bottom:26px;position:relative}
.rm-dot{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;z-index:1;
  background:#12121c;border:2px solid rgba(168,85,247,.4)}
.rm-item.now .rm-dot{background:linear-gradient(135deg,#A855F7,#3B82F6);border-color:transparent;animation:nowPing 2s infinite}
.rm-card{padding:24px 28px;border-radius:18px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);
  transition:border-color .3s,transform .3s}
.rm-item.now .rm-card{border-color:rgba(168,85,247,.5);box-shadow:0 16px 44px -18px rgba(168,85,247,.4)}
.rm-card:hover{transform:translateX(6px)}
.rm-tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  padding:4px 11px;border-radius:999px;margin-bottom:8px;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.rm-item.now .rm-tag{color:#fff;background:linear-gradient(135deg,#A855F7,#3B82F6);border-color:transparent}
.rm-card h3{font-size:19px;font-weight:800;margin-bottom:6px}
.rm-card p{color:var(--muted);font-size:14.5px}
.rm-note{max-width:860px;margin:34px auto 0;text-align:center;color:#c4b5fd;font-size:15.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:10px}
.rm-note svg{color:var(--accent);flex:none}

/* FOOTER + FLOAT */
footer{padding:44px 30px;border-top:1px solid var(--line);text-align:center;color:#5b6070;font-size:13.5px}
footer .brand{justify-content:center;margin-bottom:14px}
.foot-tg{display:inline-flex;align-items:center;gap:8px;color:#7cc8ff;text-decoration:none;font-weight:700;margin:10px 0}
.foot-tg:hover{color:#fff}
.tg-float{position:fixed;right:26px;bottom:26px;z-index:99;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  color:#fff;background:linear-gradient(135deg,#229ED9,#0088cc);box-shadow:0 12px 34px -6px rgba(0,136,204,.6);
  transition:transform .3s var(--ease)}
.tg-float:hover{transform:scale(1.1)}
.tg-float::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid rgba(34,158,217,.7);animation:ringPulse 2.2s infinite}

.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* ===== MicroSlats ===== */
.micro-slats{position:relative;width:100%;height:100%;overflow:hidden}
/* ===== TechText ===== */
.tech-text{position:relative;width:100%;height:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.tech-text-canvas{display:block;width:100%;height:100%}
/* ===== CrystalizedBall ===== */
.crystalized-ball{position:relative;width:100%;height:100%;overflow:hidden}

/* ===== BranchedMenu ===== */
.branched-menu{--bm-w:240px;--bm-ink:#f5f5f5;--bm-accent:#f5f5f5;--bm-line:#3f3f46;--bm-font:14px;--bm-row:36px;
  --bm-indent:40px;--bm-line-w:1.5;--bm-draw:400ms;--bm-fold:300ms;--bm-ease-out:cubic-bezier(.23,1,.32,1);
  --bm-muted:color-mix(in srgb,var(--bm-ink) 55%,transparent);
  position:relative;display:flex;flex-direction:column;width:fit-content;max-width:min(var(--bm-w),100%);
  padding-left:14px;color:var(--bm-ink);font-family:inherit;font-size:var(--bm-font);line-height:1.2}
.branched-menu::before{content:'';position:absolute;top:8px;bottom:0;left:0;width:2px;border-radius:1px;
  background:linear-gradient(to bottom,var(--bm-line) 0%,var(--bm-line) 55%,transparent 100%)}
.branched-menu__marker{position:absolute;top:-1px;left:0;z-index:1;width:2px;height:16px;border-radius:1px;
  background:var(--bm-accent);opacity:0;transition:top 220ms var(--bm-ease-out),opacity 150ms ease}
.branched-menu__marker[data-on]{opacity:1}
.branched-menu__section{display:flex;flex-direction:column}

.branched-menu__base,.branched-menu__reach{fill:none;stroke-width:var(--bm-line-w);stroke-linecap:round;stroke-linejoin:round}

    const compositeUniforms={tScene:{value:sceneTarget.texture},uLight:{value:0},uDecode:{value:1/encode}};
    const additive=p=>{p.setBlendFunc(gl.ONE,gl.ONE);return p;};
    const fieldMesh=new Mesh(gl,{geometry,program:additive(new Program(gl,{vertex:CBS.passVertex,fragment:CBS.field,uniforms:fieldUniforms,transparent:true,depthTest:false,depthWrite:false}))});
    const dustProgram=additive(new Program(gl,{vertex:CBS.dustVertex,fragment:CBS.dustFragment,uniforms:dustUniforms,transparent:true,depthTest:false,depthWrite:false}));
    const stirMesh=halfFloat?new Mesh(gl,{geometry,program:new Program(gl,{vertex:CBS.passVertex,fragment:CBS.stir,uniforms:stirUniforms,depthTest:false,depthWrite:false})}):null;
    const compositeMesh=new Mesh(gl,{geometry,program:new Program(gl,{vertex:CBS.passVertex,fragment:CBS.composite,uniforms:compositeUniforms,depthTest:false,depthWrite:false})});
    const disposeTarget=t=>{if(!t)return;gl.deleteFramebuffer(t.buffer);t.textures.forEach(tx=>gl.deleteTexture(tx.texture));};
    const stateTarget=rows=>new RenderTarget(gl,{width:CB.STATE_WIDTH,height:rows,color:2,depth:false,
      type:fullFloat?gl.FLOAT:gl.HALF_FLOAT,format:gl.RGBA,internalFormat:fullFloat?gl.RGBA32F:gl.RGBA16F,
      minFilter:gl.NEAREST,magFilter:gl.NEAREST});
    const dataTexture=(data,rows)=>new Texture(gl,{image:data,width:CB.STATE_WIDTH,height:rows,
      type:gl.FLOAT,format:gl.RGBA,internalFormat:gl.RGBA32F,minFilter:gl.NEAREST,magFilter:gl.NEAREST,
      generateMipmaps:false,flipY:false});
    let dust=null;
    const disposeDust=()=>{
      if(!dust)return;
      dust.mesh.geometry.remove();
      gl.deleteTexture(dust.home.texture);gl.deleteTexture(dust.seed.texture);
      disposeTarget(dust.read);disposeTarget(dust.write);dust=null;
    };
    const resetStir=()=>{
      if(!stirMesh||!dust||!dust.read||!dust.write)return;
      stirUniforms.tOffset.value=blank;stirUniforms.tVelocity.value=blank;stirUniforms.uReset.value=1;
      renderer.render({scene:stirMesh,target:dust.read,clear:false});
      renderer.render({scene:stirMesh,target:dust.write,clear:false});
      stirUniforms.uReset.value=0;
    };
    const rebuildDust=requested=>{
      const total=clamp(Math.round(requested/100)*100,0,CB.MAX_PARTICLES);
      if(dust&&dust.requested===total)return;
      disposeDust();
      if(!total){dust=null;return;}
      const data=buildDust(total);
      const indices=new Float32Array(data.count);
      for(let i=0;i<data.count;i++)indices[i]=i;
      const points=new Geometry(gl,{aIndex:{size:1,data:indices}});
      dust={requested:total,rows:data.rows,home:dataTexture(data.home,data.rows),seed:dataTexture(data.seed,data.rows),
        mesh:new Mesh(gl,{mode:gl.POINTS,geometry:points,program:dustProgram}),
        read:stirMesh?stateTarget(data.rows):null,write:stirMesh?stateTarget(data.rows):null};
      dustShared.tHome.value=dust.home;dustShared.tSeed.value=dust.seed;
      resetStir();stirring=0;
    };
    const reducedMotion=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches??false;
    const random=seeded(913);
    let width=1,height=1,raf=0,last=performance.now();
    let rimTime=0,dustTime=0,swayClock=0,introClock=0;
    let visible=true,alive=true,surge=0,stirring=0,stirEnergy=0,kick=null,nextArc=.3;
    const arcs=[];
    const pointer={x:0,y:0,inside:false,fresh:true};
    const heat={angle:0,velocity:0,power:0,near:0};
    const brush={x:0,y:0,vx:0,vy:0};
    const look={x:0,y:0,vx:0,vy:0};
    let resizePending=false;
    const applyResize=()=>{
      width=Math.max(1,container.clientWidth);height=Math.max(1,container.clientHeight);
      renderer.dpr=Math.min(window.devicePixelRatio||1,2,Math.sqrt(PIXEL_BUDGET/(width*height)));
      renderer.setSize(width,height);
      sceneTarget.setSize(gl.canvas.width,gl.canvas.height);
    };
    const resize=()=>{resizePending=true;start();};
    const spawnArc=(angle,strength)=>{
      if(arcs.length>=CB.MAX_ARCS)return;
      arcs.push({start:angle,span:(.05+random()*.07)*(random()<.5?-1:1),curl:.02+random()*.04,
        life:0,duration:.2+random()*.2,drift:(random()-.5)*.3,strength});
    };
    const frame=now=>{
      raf=0;
      if(resizePending){resizePending=false;applyResize();}
      if(!alive)return;
      const s=settingsRef.current;
      const dt=Math.min(.05,Math.max(1/240,(now-last)/1000));last=now;
      if(!s)return;
      const moving=!s.paused&&!reducedMotion;
      introClock=s.intro&&!reducedMotion?Math.min(1,introClock+dt/CB.INTRO_SECONDS):1;
      const presence=easeOut(smooth(0,.42,introClock));
      const unfold=easeOut(smooth(0,.32,introClock));
      const charge=Math.sin(Math.PI*smooth(.22,.78,introClock))*.35;
      const radius=Math.max(8,(clamp(s.size,.1,1.5)*Math.min(width,height))/2);
      const strength=s.interactive&&!reducedMotion?clamp(s.hoverStrength,0,1):0;
      const px=pointer.x-width/2,py=height/2-pointer.y;
      const reach=Math.hypot(px,py);
      const target=pointer.inside?strength:0;
      if(heat.power<.02){heat.angle=Math.atan2(py,px);heat.velocity=0;}
      const turn=wrapAngle(Math.atan2(py,px)-heat.angle);
      heat.velocity+=(120*turn-19*heat.velocity)*dt;
      heat.angle=wrapAngle(heat.angle+heat.velocity*dt);
      heat.power+=(target-heat.power)*(1-Math.exp(-dt/(target>heat.power?.3:.55)));
      const nearTarget=Math.exp(-Math.pow((reach-radius)/(radius*.45),2));
      heat.near+=(nearTarget-heat.near)*(1-Math.exp(-dt/.15));
      surge*=Math.exp(-dt/.7);
      const bx=px/radius,by=py/radius;
      if(Math.hypot(bx-brush.x,by-brush.y)>.6)pointer.fresh=true;
      if(pointer.fresh){brush.x=bx;brush.y=by;brush.vx=0;brush.vy=0;pointer.fresh=false;}
      const follow=1-Math.exp(-dt/.05);
      brush.vx+=((bx-brush.x)/dt-brush.vx)*follow;
      brush.vy+=((by-brush.y)/dt-brush.vy)*follow;
      brush.x=bx;brush.y=by;
      const brushSpeed=Math.hypot(brush.vx,brush.vy);
      const cap=brushSpeed>4?4/brushSpeed:1;
      const inBall=Math.exp(-Math.max(0,Math.hypot(bx,by)-1)*6);
      const brushPower=pointer.inside?strength*inBall*presence:0;
      stirEnergy=stirEnergy*Math.exp(-dt/1.2)+brushPower*Math.min(brushSpeed,4)*dt;
      if(moving){
        const pace=1+surge*.6+heat.power*heat.near*.3;
        const step=dt*Math.max(0,s.speed)*2*pace;
        rimTime+=step;
        dustTime+=dt*Math.max(0,s.dustSpeed)*(1+surge*.4);
        swayClock+=dt*Math.max(0,s.dustSpeed);
        const crackleNow=clamp(s.crackle+surge*.5,0,1.5);
        if(s.sparks>.01&&introClock>.55){
          nextArc-=step*s.sparks*2*(.6+crackleNow*.6);
          if(nextArc<=0){
            const local=heat.power*heat.near;
            const angle=random()<local*.7?heat.angle+(random()-.5)*.8:random()<.7?Math.PI/2+(random()-.5)*1.5:random()*Math.PI*2;
            spawnArc(angle,.8+local*.6+surge*.4);
            nextArc=.15+random()*.6;
          }
        }
        for(let i=arcs.length-1;i>=0;i--){
          const arc=arcs[i];
          arc.life+=step;arc.start+=arc.drift*step;
          if(arc.life>=arc.duration)arcs.splice(i,1);
        }
      }else arcs.length=0;
      for(let i=0;i<CB.MAX_ARCS;i++){
        const arc=arcs[i];
        arcData[i*4]=arc?arc.start:0;
        arcData[i*4+1]=arc?arc.span:0;
        arcData[i*4+2]=arc?arc.curl:0;
        arcData[i*4+3]=arc?Math.sin((Math.PI*arc.life)/arc.duration)*arc.strength:0;
      }
      rebuildDust(s.particleCount);
      const pal=s.palette;
      fieldUniforms.uCenter.value=[width/2,height/2];
      fieldUniforms.uRadius.value=radius;
      fieldUniforms.uDpr.value=renderer.dpr;
      fieldUniforms.uLine.value=Math.max(.6,radius*.0035);
      fieldUniforms.uTime.value=rimTime;
      fieldUniforms.uFrame.value=Math.floor(rimTime*24)%100000;
      fieldUniforms.uBins.value=clamp(Math.round((Math.PI*2*radius)/2.6),240,900);
      fieldUniforms.uStrands.value=Math.round(clamp(s.strands,1,CB.MAX_STRANDS));
      fieldUniforms.uCrackle.value=clamp(s.crackle,0,1)+surge*.5+charge;
      fieldUniforms.uFlares.value=clamp(s.flares,0,1);
      fieldUniforms.uGlow.value=clamp(s.glow,0,2)*(1+surge*.5+charge);
      fieldUniforms.uHaze.value=clamp(s.haze,0,2);
      fieldUniforms.uFill.value=clamp(s.fill,0,1);
      fieldUniforms.uPresence.value=presence;
      fieldUniforms.uUnfold.value=unfold;
      fieldUniforms.uBloom.value=presence*presence;
      fieldUniforms.uInside.value=smooth(.2,.95,introClock);
      fieldUniforms.uRim.value=pal.rim;fieldUniforms.uRimHot.value=pal.rimHot;
      fieldUniforms.uRimMid.value=pal.rimMid;fieldUniforms.uRimDeep.value=pal.rimDeep;
      fieldUniforms.uSpark.value=pal.spark;fieldUniforms.uSparkGlow.value=pal.sparkGlow;
      fieldUniforms.uHazeColor.value=pal.haze;fieldUniforms.uEdgeColor.value=pal.edge;
      fieldUniforms.uHeat.value=[heat.angle,heat.near,heat.power*presence,0];
      dustShared.uDustTime.value=dustTime;
      const gaze=pointer.inside?strength*presence:0;
      const lookX=clamp(bx,-1.6,1.6)*gaze,lookY=clamp(by,-1.6,1.6)*gaze;
      look.vx+=(40*(lookX-look.x)-11*look.vx)*dt;
      look.vy+=(40*(lookY-look.y)-11*look.vy)*dt;
      look.x+=look.vx*dt;look.y+=look.vy*dt;
      const swing=clamp(s.sway,0,1);
      dustShared.uTurn.value=[swing*.42*Math.sin(swayClock*.23)+look.x*.3,swing*.12*Math.sin(swayClock*.17+1.3)-look.y*.16];
      dustShared.uMotion.value=CB.MOTIONS[s.motion]??0;
      dustUniforms.uViewport.value=[width,height];
      dustUniforms.uDepth.value=clamp(s.depth,0,1);
      dustUniforms.uTwinkle.value=clamp(s.twinkle,0,1);
      dustUniforms.uPointScale.value=Math.max(1,radius/491);
      dustUniforms.uReveal.value=smooth(.18,1,introClock);
      dustUniforms.uTones.value=pal.tones.flat();
      dustUniforms.uRimTone.value=pal.rim;
      dustUniforms.uShape.value=CB.SHAPES[s.particleShape]??0;
      const layer=dust;
      if(layer&&stirMesh&&(stirEnergy>.002||kick))stirring=CB.SETTLE_SECONDS;
      let stirred=false;
      if(layer&&layer.read&&layer.write&&stirMesh&&stirring>0){
        stirUniforms.uDt.value=Math.min(dt,1/30);
        stirUniforms.uBrush.value=[brush.x,brush.y,brush.vx*cap,brush.vy*cap];
        stirUniforms.uBrushPower.value=brushPower;
        stirUniforms.uKick.value=kick?[kick.x,kick.y,kick.strength,0]:[0,0,0,0];
        stirUniforms.tOffset.value=layer.read.textures[0];
        stirUniforms.tVelocity.value=layer.read.textures[1];
        renderer.render({scene:stirMesh,target:layer.write,clear:false});
        const swap=layer.read;layer.read=layer.write;layer.write=swap;
        stirring-=dt;stirred=stirring>0;
        if(!stirred){stirring=0;resetStir();}
      }
      kick=null;
      dustUniforms.uStirred.value=stirred?1:0;
      dustUniforms.tOffset.value=layer&&layer.read?layer.read.textures[0]:blank;
      gl.clearColor(0,0,0,0);
      renderer.render({scene:fieldMesh,target:sceneTarget,clear:true});
      if(dust)renderer.render({scene:dust.mesh,target:sceneTarget,clear:false});
      compositeUniforms.uLight.value=0;
      renderer.render({scene:compositeMesh,clear:false});
      const settling=Math.abs(target-heat.power)>.002||surge>.002||stirring>0||Math.abs(heat.velocity)>.01||Math.hypot(look.vx,look.vy,look.x-lookX,look.y-lookY)>.001;
      if(visible&&(moving||introClock<1||settling))raf=requestAnimationFrame(frame);
    };
    const start=()=>{if(raf||!visible||!alive)return;last=performance.now();raf=requestAnimationFrame(frame);};
    const locate=e=>{
      const r=container.getBoundingClientRect();
      const x=e.clientX-r.left,y=e.clientY-r.top;
      return{x,y,inside:x>=0&&y>=0&&x<=r.width&&y<=r.height};
    };
    const onPointerMove=e=>{
      const spot=locate(e);
      if(spot.inside&&!pointer.inside)pointer.fresh=true;
      pointer.x=spot.x;pointer.y=spot.y;pointer.inside=spot.inside;
      if(spot.inside)start();
    };
    const onPointerDown=e=>{
      const s=settingsRef.current,spot=locate(e);
      if(!s||!s.interactive||reducedMotion||!spot.inside)return;
      if(!pointer.inside)pointer.fresh=true;
      pointer.x=spot.x;pointer.y=spot.y;pointer.inside=true;
      const radius=Math.max(8,(clamp(s.size,.1,1.5)*Math.min(width,height))/2);
      const kx=(spot.x-width/2)/radius,ky=(height/2-spot.y)/radius;
      if(Math.hypot(kx,ky)>1.3)return;
      const strength=clamp(s.hoverStrength,0,1);
      kick={x:kx,y:ky,strength:strength*1.2};
      surge=Math.max(surge,strength);
      const angle=Math.atan2(ky,kx);
      spawnArc(angle+(random()-.5)*.5,1.3);
      spawnArc(angle+Math.PI+(random()-.5)*1.2,1.1);
      start();
    };
    const onPointerLeave=()=>{pointer.inside=false;start();};
    const onPointerOut=e=>{if(!e.relatedTarget)onPointerLeave();};
    const onPointerUp=e=>{if(e.pointerType==='touch')onPointerLeave();};
    const onVisibility=()=>{if(!document.hidden)start();};
    window.addEventListener('pointermove',onPointerMove,{passive:true});
    window.addEventListener('pointerdown',onPointerDown,{passive:true});
    window.addEventListener('pointerout',onPointerOut,{passive:true});
    window.addEventListener('pointerup',onPointerUp,{passive:true});
    window.addEventListener('blur',onPointerLeave);
    document.addEventListener('visibilitychange',onVisibility);
    const ro=new ResizeObserver(resize);ro.observe(container);
    const io=new IntersectionObserver(([en])=>{visible=en.isIntersecting;start();});io.observe(container);
    wakeRef.current=start;resize();
    return()=>{
      alive=false;visible=false;cancelAnimationFrame(raf);
      ro.disconnect();io.disconnect();
      window.removeEventListener('pointermove',onPointerMove);
      window.removeEventListener('pointerdown',onPointerDown);
      window.removeEventListener('pointerout',onPointerOut);
      window.removeEventListener('pointerup',onPointerUp);
      window.removeEventListener('blur',onPointerLeave);
      document.removeEventListener('visibilitychange',onVisibility);
      wakeRef.current=null;disposeDust();disposeTarget(sceneTarget);

      if(canvas.parentNode)canvas.parentNode.removeChild(canvas);
    };
  },[]);
  return <div ref={containerRef} className={`crystalized-ball ${className}`.trim()} style={style}/>;
};

/* ================= BRANCHED MENU ================= */
const BM_PAD=6,BM_MARK=16;
const bmSet=open=>new Set(Array.isArray(open)?open:open>=0?[open]:[]);
const BranchedMenu=({items=[],defaultOpen=0,defaultActive='',onSelect,onToggle,
  color='#f5f5f5',accentColor='#A855F7',lineColor='#3f3f46',width=260,rowHeight=38,indent=40,trunk=14,
  radius=10,lineWidth=1.5,fontSize=14,drawDuration=400,foldDuration=300,className=''})=>{
  const[open,setOpen]=useState(()=>bmSet(defaultOpen));
  const[active,setActive]=useState(()=>{
    if(defaultActive)return defaultActive;
    const first=items.find((it,i)=>it.children&&bmSet(defaultOpen).has(i));
    return first?.children?.[0]?.value??'';
  });
  const navRef=useRef(null),heads=useRef([]),markerRef=useRef(null),latest=useRef({});
  latest.current={onSelect,onToggle};
  const activeSection=items.findIndex(it=>it.children?.some(k=>k.value===active));
  const markerShown=activeSection>=0&&open.has(activeSection);
  useLayoutEffect(()=>{
    const place=glide=>{
      const m=markerRef.current,el=heads.current[activeSection];
      if(!m)return;
      const on=markerShown&&el;
      if(!glide)m.style.transition='none';
      if(on)m.style.top=`${el.offsetTop+(el.offsetHeight-BM_MARK)/2}px`;
      m.toggleAttribute('data-on',Boolean(on));
      if(!glide){void m.offsetHeight;m.style.transition='';}
    };
    place(true);
    let first=true;
    const ro=new ResizeObserver(()=>{if(first){first=false;return;}place(false);});
    if(navRef.current)ro.observe(navRef.current);
    return()=>ro.disconnect();
  },[activeSection,markerShown,items,fontSize,rowHeight]);
  const select=(value,item)=>{setActive(value);latest.current.onSelect?.(value,item);};
  const toggle=i=>{
    setOpen(prev=>{
      const next=new Set(prev);
      const isOpen=!next.has(i);
      if(isOpen)next.add(i);else next.delete(i);
      latest.current.onToggle?.(i,isOpen);
      return next;
    });
  };
  const r=Math.min(radius,rowHeight/2-2);
  const endX=indent-8;
  const rowY=k=>BM_PAD+k*rowHeight+rowHeight/2;
  const branch=k=>`M ${trunk} ${rowY(k)-r} A ${r} ${r} 0 0 0 ${trunk+r} ${rowY(k)} H ${endX}`;
  const reach=k=>`M ${trunk} 0 V ${rowY(k)-r} A ${r} ${r} 0 0 0 ${trunk+r} ${rowY(k)} H ${endX}`;
  const length=k=>rowY(k)-r+(Math.PI*r)/2+(endX-trunk-r);
  return(
    <nav ref={navRef} className={`branched-menu${className?` ${className}`:''}`}
      style={{'--bm-w':`${width}px`,'--bm-ink':color,'--bm-accent':accentColor,'--bm-line':lineColor,
        '--bm-font':`${fontSize}px`,'--bm-row':`${rowHeight}px`,'--bm-indent':`${indent}px`,
        '--bm-line-w':lineWidth,'--bm-draw':`${drawDuration}ms`,'--bm-fold':`${foldDuration}ms`}}>
      <span ref={markerRef} className="branched-menu__marker" aria-hidden="true"/>
      {items.map((item,i)=>{
        const kids=item.children;
        const isOpen=kids?open.has(i):false;
        const leafValue=item.value??item.label;
        const leafActive=!kids&&leafValue===active;
        const bodyH=kids?BM_PAD*2+kids.length*rowHeight:0;
        return(
          <div key={item.value??item.label} className="branched-menu__section" data-open={isOpen?'':undefined}>
            <button ref={el=>{heads.current[i]=el;}} type="button" className="branched-menu__head"
              aria-expanded={kids?isOpen:undefined} aria-current={leafActive?'true':undefined}
              data-active={leafActive?'':undefined}
              onClick={()=>kids?toggle(i):select(leafValue,item)}>
              {item.label}
            </button>
            {kids?(
              <div className="branched-menu__body">
                <div className="branched-menu__fold">
                  <div className="branched-menu__tree" style={{height:bodyH}}>
                    <svg className="branched-menu__lines" width={indent} height={bodyH} aria-hidden="true">
                      <path className="branched-menu__base" d={`M ${trunk} 0 V ${rowY(kids.length-1)-r}`}/>
                      {kids.map((kid,k)=><path key={kid.value} className="branched-menu__base" d={branch(k)}/>)}
                      {kids.map((kid,k)=>(
                        <path key={kid.value} className="branched-menu__reach" d={reach(k)}
                          style={{strokeDasharray:length(k),strokeDashoffset:kid.value===active?0:length(k)}}/>
                      ))}
                    </svg>
                    {kids.map(kid=>(
                      <button key={kid.value} type="button" className="branched-menu__item"
                        aria-current={kid.value===active?'true':undefined}
                        data-active={kid.value===active?'':undefined}
                        tabIndex={isOpen?0:-1}
                        onClick={()=>select(kid.value,kid)}>
                        {kid.icon?<span className="branched-menu__icon" aria-hidden="true">{kid.icon}</span>:null}
                        <span className="branched-menu__label">{kid.label}</span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            ):null}
          </div>
        );
      })}
    </nav>
  );
};

/* ================= SPECULAR BUTTON ================= */
const SB_PAD=24,TAU=Math.PI*2;
const SB_VERTEX=`#version 300 es
in vec2 aPosition;void main(){gl_Position=vec4(aPosition,0.0,1.0);}`;
const SB_FRAGMENT=`#version 300 es
precision highp float;
uniform vec2 uCenter;uniform vec2 uHalf;uniform float uRadius;uniform float uPx;uniform float uSpot;uniform vec2 uEntry;
uniform vec3 uLineColor;uniform vec3 uBaseColor;uniform float uIntensity;uniform vec2 uWindow;uniform float uThickness;uniform float uGlow;
out vec4 outColor;
float roundedBox(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.0))+min(max(q.x,q.y),0.0)-r;}
float loopPosition(vec2 p,vec2 b,float r){
vec2 inner=b-r;
float arc=1.5707963*r;
float quarter=inner.x+inner.y+arc;
vec2 a=abs(p);
vec2 q=a-inner;
float s=q.x>0.0&&q.y>0.0?inner.y+atan(q.y,q.x)*r:(q.x>q.y?min(a.y,inner.y):inner.y+arc+inner.x-min(a.x,inner.x));
if(p.x<0.0)s=p.y>=0.0?2.0*quarter-s:2.0*quarter+s;
else if(p.y<0.0)s=4.0*quarter-s;
return s/max(4.0*quarter,0.0001);}
float lobe(float position,float center){
float gap=abs(fract(position-center+0.5)-0.5);
return 1.0-smoothstep(uWindow.x,uWindow.x+uWindow.y,gap);}
void main(){
vec2 p=gl_FragCoord.xy-uCenter;
float d=roundedBox(p,uHalf,uRadius);
float position=loopPosition(p,uHalf,uRadius);
float key=lobe(position,uSpot);
float back=lobe(position,uSpot+0.5);
float streak=key+back*0.45;
float width=max(uThickness*uPx*mix(1.0,max(key,back),0.6),0.35);
float band=smoothstep(-width-0.6,-width+0.6,d)*(1.0-smoothstep(-0.6,0.6,d));
float hair=smoothstep(-uPx-0.6,-uPx+0.6,d)*(1.0-smoothstep(-0.6,0.6,d));

const Reveal=({children,delay=0,className=''})=>{
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current;
    if(!el)return;
    const io=new IntersectionObserver(([e])=>{
      if(e.isIntersecting){el.classList.add('in');io.disconnect();}
    },{threshold:.1});
    io.observe(el);
    return()=>io.disconnect();
  },[]);
  return <div ref={ref} className={`reveal ${className}`} style={{transitionDelay:`${delay}ms`}}>{children}</div>;
};

const Progress=()=>{
  const ref=useRef(null);
  useEffect(()=>{
    const on=()=>{
      const h=document.documentElement;
      const p=h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight);
      if(ref.current)ref.current.style.width=`${p*100}%`;
    };
    window.addEventListener('scroll',on,{passive:true});
    window.addEventListener('resize',on);
    on();
    return()=>{window.removeEventListener('scroll',on);window.removeEventListener('resize',on);};
  },[]);
  return <div className="progress" ref={ref}/>;
};

              <p className="sec-sub">Двигай мышью — стена наклоняется за тобой. Наведи на плитку — она выпрыгнет из глубины. Клик откроет Telegram.</p>
            </div>
          </Reveal>
          <Reveal>
            <div className="drift-wrap">
              <DriftWall items={WALL_ITEMS} columns={5} tileWidth={210} tileHeight={140}
                gap={18} radius={16} tilt={16} turn={-14} perspective={1200} depth={120}
                speed={40} direction="up" variance={.45} parallax={.6} lift={70}
                fade={.6} dim={.6} overlayColor="#07070c"/>
            </div>
          </Reveal>
          <p className="drift-note">{I.Cursor(15)} Каждая плитка — реальная возможность ZIX AI</p>
        </section>

        {/* TRY — тест только в Telegram */}
        <section>
          <Reveal>
            <div className="sec-head">
              <div className="sec-kicker">{I.Lock(14)} Доступ</div>
              <h2 className="sec-title">Где попробовать ZIX AI</h2>
              <p className="sec-sub">Тестирование на сайте закрыто. Полная версия нейросети и всё общение — в нашем Telegram.</p>
            </div>
          </Reveal>
          <div className="try-grid">
            <Reveal>
              <div className="locked-card" aria-label="Демонстрация чата заблокирована">
                <div className="ghost-chat" aria-hidden="true">
                  <div className="ghost-msg u">Напиши змейку на Python</div>
                  <div className="ghost-msg a">Конечно! Вот готовый код игры:
                    <pre>import pygame\npygame.init()\n# ... 120 строк кода</pre>
                  </div>
                  <div className="ghost-msg u">А теперь идею для хоррора!</div>
                  <div className="ghost-msg a">Идея: «Тихий этаж» — каждую ночь меняется одна деталь...</div>
                </div>
                <div className="ghost-input" aria-hidden="true"/>
                <div className="locked-overlay">
                  <span className="lock-ring">{I.Lock(34)}</span>
                  <h3>Демо на сайте недоступно</h3>
                  <p>Мы закрыли тестирование на сайте, чтобы сосредоточиться на развитии. Попробовать ZIX AI можно в Telegram.</p>
                </div>
              </div>
            </Reveal>
            <Reveal delay={140}>
              <div className="try-cta">
                <span className="try-cta-ic">{I.Telegram(34)}</span>
                <h3>Всё — в одном канале</h3>
                <p>
                  Тестирование нейросети, исходники этого сайта, обновления системы ZIXD
                  и поддержка — в нашем Telegram-канале. Бесплатно и без регистрации.
                </p>
                <SpecularButton size="lg" radius={18} tint="#229ED9" tintOpacity={.16}
                  lineColor="#7cc8ff" baseColor="#1e3a4a" textColor="#ffffff"
                  autoAnimate speed={.35} glow={1.3} thickness={1.4} onClick={openTG}>
                  {I.Telegram(20)} Открыть @ZIX_AI_original
                </SpecularButton>
                <div className="try-perks">
                  <span className="try-perk">{I.Chat(16)} Тестирование ИИ</span>
                  <span className="try-perk">{I.Code(16)} Исходники сайта</span>
                  <span className="try-perk">{I.Zap(16)} Обновления ZIXD</span>
                </div>
                <span className="try-handle">t.me/ZIX_AI_original</span>
              </div>
            </Reveal>
          </div>
        </section>

        {/* ROADMAP */}
        <section>
          <Reveal>
            <div className="sec-head">
              <div className="sec-kicker">{I.Flag(14)} Только начало</div>
              <h2 className="sec-title">Мы только в начале пути</h2>
              <p className="sec-sub">Проект только начинает своё продвижение — но он и дальше будет развиваться. Каждый день — новый шаг.</p>
            </div>
          </Reveal>
          <div className="roadmap">
            {[
              {now:true,ic:I.Flag(20),tag:'Сейчас',t:'Старт продвижения',
                d:'Сайт, Telegram-канал и первые пользователи. ZIXD уже раздаёт запросы, а мы собираем первые отзывы.'},
              {ic:I.Users(20),tag:'Скоро',t:'Рост комьюнити',
                d:'Больше людей — больше серверов ZIXD. Еженедельные обновления и улучшения по вашим отзывам.'},
              {ic:I.Cpu(20),tag:'Дальше',t:'Новые возможности ИИ',
                d:'Больше языков кода, глубже анализ, умнее ответы. Нейросеть будет учиться и становиться сильнее.'},
              {ic:I.Rocket(20),tag:'Будущее',t:'Экосистема ZIX',
                d:'ZIX AI и дальше будет развиваться — от одной нейросети к большой экосистеме инструментов для всех.'}
            ].map((r,i)=>(
              <Reveal key={i} delay={i*110}>
                <div className={`rm-item${r.now?' now':''}`}>
                  <span className="rm-dot">{r.ic}</span>
                  <div className="rm-card">
                    <span className="rm-tag">{r.tag}</span>
                    <h3>{r.t}</h3>
                    <p>{r.d}</p>
                  </div>
                </div>
              </Reveal>
            ))}
          </div>
          <Reveal>
            <p className="rm-note">{I.Spark(18)} Это только начало. Дальше — больше. Следи за развитием в Telegram.</p>
          </Reveal>
        </section>
      </main>

      <footer>
        <div className="brand">
          <span className="brand-mark">{I.Spark(16)}</span>
          <span className="brand-name">ZIX <b>AI</b></span>
        </div>
        <div>
          <a className="foot-tg" href={TG} target="_blank" rel="noreferrer">
            {I.Telegram(16)} @ZIX_AI_original
          </a>
        </div>
        <p>Проект развивается. Все новости и тестирование — в Telegram.</p>
        <p style={{marginTop:'8px'}}>© 2026 ZIX AI • работает на системе ZIXD</p>
      </footer>

      <a className="tg-float" href={TG} target="_blank" rel="noreferrer" aria-label="Telegram канал ZIX AI">
        {I.Telegram(26)}
      </a>
    </div>
  );
};

const rootEl=document.getElementById('root');
if(ReactDOM.createRoot)ReactDOM.createRoot(rootEl).render(<App/>);
else ReactDOM.render(<App/>,rootEl);
}
initApp();
</script>
